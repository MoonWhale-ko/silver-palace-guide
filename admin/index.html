<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실버 스트림 · 홈 관리</title><style>
:root{color-scheme:dark;font:14px/1.6 system-ui;--line:#383e52}*{box-sizing:border-box}body{margin:0;background:#10121b;color:#e1dfe4}header{padding:22px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header a{color:#9baeff}main{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 80px)}form{padding:25px;border-right:1px solid var(--line)}h2{font-size:17px;margin:0 0 18px}label{display:block;margin:15px 0;color:#a9afc2;font-size:12px}input,textarea{display:block;width:100%;background:#1b1e2a;border:1px solid var(--line);color:#e1dfe4;padding:10px;margin-top:6px;font:inherit}textarea{resize:vertical;min-height:70px}button{padding:11px 14px;background:#9baeff;border:0;color:#101529;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:wait}.secondary{background:#293454;color:#e1dfe4}.actions{display:flex;gap:10px;position:sticky;bottom:0;background:#10121b;padding:15px 0}fieldset{border:1px solid var(--line);margin:20px 0;padding:12px}legend{color:#9baeff}.preview{padding:24px;position:sticky;top:0;height:100vh}iframe{width:100%;height:calc(100% - 50px);border:1px solid var(--line);background:#10121b}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.toolbar span{margin-right:auto}p{color:#a9afc2;font-size:12px}#status{white-space:pre-wrap}@media(max-width:900px){main{display:block}form{border:0}.preview{position:static;height:700px}header{padding:18px}h1{font-size:18px}}
</style><header><h1>실버 스트림 · 홈 관리</h1><a href="/" target="_blank" rel="noopener">홈 화면 열기 ↗</a></header><main><form id="form"><h2>홈 화면 설정</h2><p>문구를 수정하면 오른쪽에서 바로 확인할 수 있습니다. GitHub에 저장하면 연결된 사이트 배포에 반영됩니다.</p><div id="fields"></div><div class="actions"><button id="save" disabled>GitHub에 저장</button><button type="button" class="secondary" id="reload">다시 불러오기</button></div><p id="status" role="status" aria-live="polite">불러오는 중…</p></form><section class="preview"><div class="toolbar"><span>홈 미리보기</span><button type="button" class="secondary" id="desktop">넓게</button><button type="button" class="secondary" id="mobile">모바일</button></div><iframe id="preview" src="/" title="홈 화면 미리보기"></iframe></section></main><script type="module">
import {validate} from '/assets/home.js';
let data,sha,dirty=false;const fields=document.querySelector('#fields'),status=document.querySelector('#status'),save=document.querySelector('#save'),frame=document.querySelector('#preview');
const labels={heading:'대표 제목',description:'대표 설명',beginnerTitle:'입문 안내 제목',beginnerDescription:'입문 안내 설명',updateText:'최근 업데이트 내용',updateDate:'업데이트 날짜'};
function preview(){if(data)frame.contentWindow.postMessage({type:'home-preview',data},location.origin);}
function field(parent,label,value,change,type='text'){
  const wrap=document.createElement('label');wrap.append(label);const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=value;input.maxLength=type==='date'?10:500;input.oninput=()=>{change(input.value);dirty=true;status.textContent='저장하지 않은 변경 사항이 있습니다.';preview();};wrap.append(input);parent.append(wrap);
}
async function load(){save.disabled=true;try{const r=await fetch('/api/home');if(!r.ok){let message='관리자 인증 및 GitHub 연결을 확인하세요.';try{message=(await r.json()).error||message;}catch{}throw Error(message);}const result=await r.json();data=validate(result.data);sha=result.sha;dirty=false;fields.replaceChildren();for(const [key,label]of Object.entries(labels))field(fields,label,data[key],v=>data[key]=v,key==='updateDate'?'date':key==='heading'?'textarea':'text');data.menus.forEach((menu,i)=>{const group=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent='메뉴 '+(i+1);group.append(legend);field(group,'이름',menu.title,v=>menu.title=v);field(group,'설명',menu.description,v=>menu.description=v);field(group,'이동 주소 · 비우면 준비 중',menu.url,v=>menu.url=v);fields.append(group);});preview();status.textContent='최신 GitHub 설정을 불러왔습니다.';save.disabled=false;}catch(e){status.textContent=e.message;}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{validate(data);}catch(e){status.textContent=e.message;return;}save.disabled=true;status.textContent='GitHub에 저장 중…';try{const r=await fetch('/api/home',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data,sha})});const result=await r.json();if(!r.ok)throw Error(result.error);sha=result.sha;dirty=false;status.textContent='GitHub 저장 완료. 사이트 반영 여부는 배포 연결 상태에 따라 달라집니다.';}catch(e){status.textContent=e.message;}finally{save.disabled=false;}};
document.querySelector('#reload').onclick=()=>{if(!dirty||confirm('저장하지 않은 변경을 버리고 다시 불러올까요?'))load();};
frame.onload=preview;document.querySelector('#mobile').onclick=()=>{frame.style.maxWidth='390px';};document.querySelector('#desktop').onclick=()=>{frame.style.maxWidth='none';};addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});load();
</script></html>
